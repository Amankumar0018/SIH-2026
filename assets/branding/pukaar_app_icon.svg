<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C2B" />
      <stop offset="100%" stop-color="#090E18" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pukaarCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B6E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="pukaarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="pukaarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgDark)" />
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  <g filter="url(#pukaarShadow)">
    <!-- Outer Shield Crest -->
    <path d="M 230 110 
             L 320 80 
             C 380 120, 420 180, 420 270 
             C 420 340, 360 400, 310 420 
             L 280 430 
             L 280 395 
             C 340 370, 385 320, 385 260 
             C 385 190, 350 140, 310 115 
             Z" 
          fill="url(#pukaarCrimson)" />

    <!-- Emergency Pulse Wave -->
    <path d="M 70 260 
             L 100 260 
             L 115 220 
             L 130 300 
             L 145 170 
             L 160 330 
             L 175 225 
             L 190 280 
             L 205 260 
             L 245 260" 
          fill="none" 
          stroke="url(#pukaarCrimson)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Stylized 'P' Dynamic Loop -->
    <path d="M 180 170 
             C 180 120, 230 100, 290 100 
             C 350 100, 380 140, 380 190 
             C 380 240, 340 270, 280 270 
             L 245 260 
             C 280 250, 340 230, 340 190 
             C 340 150, 310 130, 280 130 
             C 240 130, 215 150, 215 180 
             L 215 360 
             C 215 410, 175 430, 160 410 
             C 150 390, 180 360, 180 320 
             Z" 
          fill="url(#pukaarCrimson)" />

    <!-- Golden Radiant Siren / Beacon at Epicenter -->
    <g transform="translate(295, 205)">
      <path d="M -30 20 
               C -25 -10, -20 -30, 0 -35 
               C 20 -30, 25 -10, 30 20 
               Z" 
            fill="url(#pukaarAmber)" />
      <rect x="-34" y="20" width="68" height="10" rx="5" fill="url(#pukaarAmber)" />
      
      <circle cx="0" cy="-48" r="4" fill="url(#pukaarAmber)" />
      <circle cx="-25" cy="-40" r="4" fill="url(#pukaarAmber)" />
      <circle cx="25" cy="-40" r="4" fill="url(#pukaarAmber)" />
      <circle cx="-42" cy="-22" r="4" fill="url(#pukaarAmber)" />
      <circle cx="42" cy="-22" r="4" fill="url(#pukaarAmber)" />
      <circle cx="-50" cy="0" r="4" fill="url(#pukaarAmber)" />
      <circle cx="50" cy="0" r="4" fill="url(#pukaarAmber)" />
    </g>
  </g>
</svg>